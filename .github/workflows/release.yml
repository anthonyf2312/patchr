name: Release

# Every push to main publishes the `edge` image. Conventional Commits also keep a release PR up to
# date; merging it tags a release, and the same image job adds the version tags (1.2.3, 1.2, 1, latest).
#
# The image is built in this workflow on purpose. Releases created with GITHUB_TOKEN don't
# trigger other workflows, so a separate "on: release" workflow would never run.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    # Runs even if release-please failed, so `edge` still ships; a failed step just means no release tags.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Edge builds queue behind each other so `edge` always ends on the newest commit. Release builds
    # get their own group, so a later push can never cancel one.
    concurrency:
      group: docker-${{ needs.release-please.outputs.created == 'true' && github.sha || 'edge' }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/patchr
      RELEASE: ${{ needs.release-please.outputs.created == 'true' }}
      VERSION: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
      MAJOR_MINOR: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
      MAJOR: ${{ needs.release-please.outputs.major }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ env.VERSION }},enable=${{ env.RELEASE }}
            type=raw,value=${{ env.MAJOR_MINOR }},enable=${{ env.RELEASE }}
            type=raw,value=${{ env.MAJOR }},enable=${{ env.RELEASE }}
            type=raw,value=latest,enable=${{ env.RELEASE }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
