name: Feature request
description: Suggest something Patchr should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the feature. It helps find the best fix.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
