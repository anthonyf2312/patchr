# Runs Patchr with its own Postgres. Put your settings in .env next to this file (see .env.example).
#   docker compose up -d
name: patchr

services:
  patchr:
    # Follows the newest 1.x release, so a breaking 2.0 never installs itself.
    # Set PATCHR_TAG=edge in .env to run the newest code on main instead.
    image: ghcr.io/anthonyf2312/patchr:${PATCHR_TAG:-1}
    # To build from source instead of pulling the published image:
    # build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # The password goes in PGPASSWORD rather than the URL, so it can contain any characters.
      DATABASE_URL: postgres://patchr@db:5432/patchr
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: patchr
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18, so the volume goes one level up.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchr -d patchr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
